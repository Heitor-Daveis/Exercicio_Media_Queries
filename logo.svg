<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tech Experience 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="0.35" stop-color="#FF7A18"/>
      <stop offset="0.7" stop-color="#8B3DFF"/>
      <stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <linearGradient id="quente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <linearGradient id="frio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B3DFF"/>
      <stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <radialGradient id="fundo" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2A1146"/>
      <stop offset="1" stop-color="#0A0A0F"/>
    </radialGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base redonda -->
  <circle cx="256" cy="256" r="248" fill="url(#anel)"/>
  <circle cx="256" cy="256" r="232" fill="url(#fundo)"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- símbolo de código < > -->
  <g filter="url(#brilho)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="24">
    <polyline points="150,190 96,256 150,322" stroke="url(#frio)"/>
    <polyline points="362,190 416,256 362,322" stroke="url(#quente)"/>
  </g>

  <!-- letra T central -->
  <g filter="url(#brilho)">
    <rect x="192" y="186" width="128" height="30" rx="15" fill="url(#quente)"/>
    <rect x="241" y="186" width="30" height="140" rx="15" fill="url(#frio)"/>
  </g>

  <!-- pontos orbitais -->
  <circle cx="256" cy="86" r="9" fill="#FF3D9A"/>
  <circle cx="256" cy="426" r="9" fill="#FF7A18"/>
  <path d="M196 380 H316" stroke="url(#anel)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
